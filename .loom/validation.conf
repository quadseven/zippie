# PR validation runs lint, format, type checking, then tests.
# The Python lint job calls infra-public/check.python.yml, step
# "Ruff check + format --check". Its pinned RUFF and default paths expand
# to the first two commands below.
# .github/workflows/check.python-lint.yml | lint | ruff (check + format)
# .github/workflows/check.python-lint.yml | format | ruff (check + format)
# .github/workflows/check.agent-tests.yml | type | go vet
# .github/workflows/check.agent-tests.yml | test | zippie agent pytest
# .github/workflows/check.agent-tests.yml | test | go test
# The agent test job passes its test-cmd to the reusable workflow's Test step.
# The datapath go test job runs on every pull request and is required (#423).
# interpreter: uv, not bash: the lane check sandbox reads only the
# interpreter's directory under HOME, and uvx lives beside uv. With bash,
# every lane check exited 127 ("uvx: command not found").
interpreter: uv
check: uvx ruff@0.15.10 check . && uvx ruff@0.15.10 format --check . && (cd travel/datapath-go && go vet ./...) && (cd travel/bond-agent && uv run --with 'pytest>=8.0' --with tomli --python 3.9 python -m pytest -q --basetemp="${RUNNER_TEMP:-/tmp}/zippie-pytest") && (cd travel/datapath-go && go test ./... -race -count=1)
# affected: .github/workflows/app.companion-ios.ci.yml :: swift test
# affected: .github/workflows/app.companion-ios.ci.yml :: build for simulator (unsigned)
# Generate the Go framework and project from this checkout. XcodeGen needs
# a USER value for generated project metadata even in the scrubbed lane.
# Foundation tools use CFFIXED_USER_HOME for caches under the scratch HOME.
affected: printf '%s\n' "${LOOM_CHANGED_FILES:-}" | grep -qE '^(companion/|\.github/workflows/app\.companion-ios\.ci\.yml$)' || exit 0; set -euo pipefail; export CFFIXED_USER_HOME="$HOME"; RUNNER_TEMP=$(mktemp -d "${TMPDIR:-/tmp}/zippie-ios.XXXXXX"); export RUNNER_TEMP; trap 'rm -rf "$RUNNER_TEMP"' EXIT; (cd companion/ZippieCompanionKit; swift test 2>&1 | tee "$RUNNER_TEMP/swift-test.log"; grep -qE "Executed [1-9][0-9]* test" "$RUNNER_TEMP/swift-test.log" || { echo "::error::no tests actually executed"; exit 1; }); source companion/scripts/setup-gomobile.sh; companion/scripts/build-datapath-framework.sh; cd companion; USER=loom-validation xcodegen generate; xcodebuild -project ZippieCompanion.xcodeproj -scheme ZippieCompanion -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -40
