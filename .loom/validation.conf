# PR validation runs lint, format, type checking, then tests.
# The Python lint job calls infra-public/check.python.yml, step
# "Ruff check + format --check". Its pinned RUFF and default paths expand
# to the first two commands below.
# .github/workflows/check.python-lint.yml | lint | ruff (check + format)
# .github/workflows/check.python-lint.yml | format | ruff (check + format)
# .github/workflows/check.agent-tests.yml | type | go vet
# .github/workflows/check.agent-tests.yml | test | zippie agent pytest
# The agent test job passes its test-cmd to the reusable workflow's Test step.
interpreter: bash
check: uvx ruff@0.15.10 check . && uvx ruff@0.15.10 format --check . && (cd travel/datapath-go && go vet ./...) && (cd travel/bond-agent && uv run --with 'pytest>=8.0' --with tomli --python 3.9 python -m pytest -q --basetemp="${RUNNER_TEMP:-/tmp}/zippie-pytest")
