# PR validation runs lint, format, type checking, then tests.
# The Python lint job calls infra-public/check.python.yml, step
# "Ruff check + format --check". Its pinned RUFF and default paths expand
# to the first two commands below.
# .github/workflows/check.python-lint.yml | lint | ruff (check + format)
# .github/workflows/check.python-lint.yml | format | ruff (check + format)
# .github/workflows/check.agent-tests.yml | type | go vet
# .github/workflows/check.agent-tests.yml | test | zippie agent pytest
# .github/workflows/check.agent-tests.yml | test | go test
# Also run: check.design-tokens.yml drift job (generate.py --check)
# Also run: check.operator-hosts.yml hosts job (self-test, ratchet, README standard)
# The agent test job passes its test-cmd to the reusable workflow's Test step.
# The datapath go test job runs on every pull request and is required (#423).
# interpreter: uv, not bash: the lane check sandbox reads only the
# interpreter's directory under HOME, and uvx lives beside uv. With bash,
# every lane check exited 127 ("uvx: command not found").
interpreter: uv
check: uvx ruff@0.15.10 check . && uvx ruff@0.15.10 format --check . && (cd travel/datapath-go && go vet ./...) && (cd travel/bond-agent && uv run --with 'pytest>=8.0' --with tomli --python 3.9 python -m pytest -q --basetemp="${RUNNER_TEMP:-/tmp}/zippie-pytest") && (cd travel/datapath-go && go test ./... -race -count=1) && python3 design/generate.py --check && bash scripts/check-no-operator-hosts.sh --self-test && bash scripts/check-no-operator-hosts.sh && python3 travel/bond-agent/tests/test_readme_standard.py
# affected: .github/workflows/app.companion-ios.ci.yml :: swift test
# affected: .github/workflows/check.android.yml :: gradle unit tests + debug assemble (Unit tests step)
# Keep path selection and test-result checks in the base branch contract.
affected: set -euo pipefail; changed="${LOOM_CHANGED_FILES:-}"; if grep -qE '^(companion-android/|\.github/workflows/check\.android\.yml$)' <<< "$changed"; then (cd companion-android; log=$(mktemp); trap 'rm -f "$log"' EXIT; ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee "$log"; reports=(app/build/test-results/testDebugUnitTest/*.xml); [ -f "${reports[0]}" ] || { echo "::error::no test result XML produced - no tests actually ran"; exit 1; }; total=$(sed -n 's/.*<testsuite [^>]*tests="\([0-9]*\)".*/\1/p' "${reports[@]}" | awk '{s+=$1} END {print s+0}'); [ "$total" -gt 0 ] || { echo "::error::test result XML reports zero tests"; exit 1; }); fi; grep -qE '^(companion/|\.github/workflows/app\.companion-ios\.ci\.yml$)' <<< "$changed" || exit 0; cd companion/ZippieCompanionKit; log=$(mktemp); trap 'rm -f "$log"' EXIT; swift test 2>&1 | tee "$log"; grep -qE 'Executed [1-9][0-9]* test' "$log" || { echo "::error::no tests actually executed"; exit 1; }
