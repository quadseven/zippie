# Zippie home exit server (#1986). See README.md for why hostNetwork, why this
# node, and why inbound UDP is still required.
#
# hostNetwork + NET_ADMIN are LOAD-BEARING, not convenience:
#   - wg must bind the node's real addresses; a pod IP is not reachable from the
#     internet regardless of what Service wraps it.
#   - wg-quick's PostUp runs `iptables -t nat -A POSTROUTING -o <wan> -j
#     MASQUERADE` and `sysctl -w net.ipv4.ip_forward=1`. In a pod netns that
#     NATs the wrong interface and sets a sysctl nobody reads.
#
# Pinned via zippie.dev/home-exit: kernel WireGuard is confirmed
# working there (6.12 UEK, module loaded, `ip link add type wireguard` succeeds,
# verified 2026-07-27). Do NOT let this reschedule - a different node means a
# different WAN interface, a different public path, and orphaned state.
---
apiVersion: v1
kind: Namespace
metadata:
  name: zippie
  labels:
    app.kubernetes.io/part-of: zippie
---
# The server's private key and peer list. Losing this invalidates EVERY
# provisioned travel client, so it is a real volume, not an emptyDir.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zippie-home-state
  namespace: zippie
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  # PINNED TO THE VOLUME THAT ALREADY HOLDS THE KEYS, and this is the whole
  # reason the 2026-08-08 namespace migration was safe (#65).
  #
  # This volume carries server.json, clients/ and wireguard/ - the identity of
  # the home exit and the bundles for nine provisioned peers. Letting local-path
  # provision a FRESH volume here would have produced a working-looking pod with
  # a new server key, and every travel client would have failed to handshake
  # against a router config that pins server_public_key. The failure would have
  # looked like a network problem, not a storage one.
  #
  # So the PV was set to Retain, the old PVC deleted, its claimRef cleared, and
  # this PVC bound to the same volume by name. The keys were never copied and
  # never left the cluster.
  #
  # A fresh install elsewhere must DROP this line - it names a volume that only
  # exists on this cluster. This directory has always been specific to k8s-oke.
  volumeName: pvc-40886936-10df-4898-807f-0c53341a79a0
  resources:
    requests:
      storage: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zippie-home
  namespace: zippie
  labels: {app: zippie-home}
spec:
  # HOW MANY OLD REPLICASETS TO KEEP, and therefore how many generator
  # ConfigMaps stay pinned (#64).
  #
  # THE GENERATOR IS NOT THE LEAK. `configMapGenerator` mints a new
  # hash-suffixed ConfigMap on every content change - that is the point, it is
  # what rolls the pod - and `kubectl apply` cannot prune, so old ones stay.
  # But each retained ReplicaSet REFERENCES its ConfigMap generation, which is
  # exactly what makes `kubectl rollout undo` work. So the ConfigMaps are not
  # junk while the ReplicaSets that name them are kept: deleting them would
  # silently break rollback, which is this issue's own fourth criterion.
  #
  # The unbounded thing was the rollback window. Unset, this defaults to 10, so
  # each workload pins up to ten ConfigMap generations forever. Reconciled live
  # 2026-08-10: 11 ConfigMaps, 5 mounted by a running pod, 6 held by a
  # ReplicaSet, and ZERO referenced by nothing - the accumulation is entirely
  # retained history, not orphans.
  #
  # 3 because the useful rollback is "the one before this", occasionally two
  # back; past that you deploy a fix forward rather than reaching for a
  # fortnight-old revision. Raising it is this one line if a longer window is
  # ever wanted, and Kubernetes garbage-collects the excess ReplicaSets itself -
  # nothing here deletes anything by hand.
  revisionHistoryLimit: 3
  replicas: 1
  # Recreate, not RollingUpdate: two pods would both try to bind the same UDP
  # ports on the same node's host network and fight over the same wg interface.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: zippie-home}
  template:
    metadata:
      # LABELS, NOT ANNOTATIONS. These were annotations, and unified service
      # tagging only reads pod LABELS - so the agent had no service name for
      # this pod and fell back to the image, which is why every log line from
      # it landed as `service:alpine` (quadseven/infra#2265). Nothing errored
      # and nothing warned; the tags were simply never read. Same shape as
      # pasto-api and digital-ledger-web, which have always had them as labels.
      #
      # The Deployment selector is {app: zippie-home} and stays that way -
      # extra template labels do not affect matching, and the selector is
      # immutable anyway.
      labels:
        app: zippie-home
        tags.datadoghq.com/env: prod
        tags.datadoghq.com/service: zippie-home
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      nodeSelector:
        zippie.dev/home-exit: "true"
      containers:
        - name: bond-server
          image: alpine:3.20
          # NOTE: apk at start is a shortcut until a proper image is baked and
          # pushed to registry.ts.example-home.invalid - a restart needs node internet.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              apk add --no-cache wireguard-tools iptables bash python3 >/dev/null
              install -m 0755 /scripts/zippie_home.py /usr/local/bin/zippie-home

              # init is idempotent: it refuses to rekey without --force, which is
              # exactly what makes it safe on every pod start. Losing the key
              # would invalidate every provisioned client.
              zippie-home init \
                --public-endpoint "$ZIPPIE_HOME_ENDPOINT" \
                --ports "$ZIPPIE_HOME_PORTS" \
                ${ZIPPIE_HOME_WAN:+--wan-iface "$ZIPPIE_HOME_WAN"}

              zippie-home up
              zippie-home show

              # The home transport (packet datapath, #2112). Runs ONLY when a
              # transport port is configured, so an unset value leaves this pod
              # byte-for-byte in its proven route-mode behaviour.
              #
              # It binds the REDIRECT TARGET, not the public port: firewalld on
              # this node only passes unsolicited UDP carrying `ct status dnat`,
              # so a direct bind on the public port receives nothing while every
              # iptables counter still says the packet arrived (#2134).
              #
              # Supervised in a restart loop rather than left to die quietly. It
              # is deliberately NOT part of the liveness probe: during the
              # staged rollout the transport owns only a spare port, so killing
              # the pod over it would take down route mode - which is carrying
              # real traffic - to protect something that is not yet.
              # HEADER MAC ARGUMENTS, built once. A `case` and not
              # ${VAR:+...}: an explicit auth_level of "off" is non-empty, so
              # the `:+` form would have passed --auth-key-file alongside
              # --auth-level=off, which auth.py refuses as a contradiction -
              # and the transport would crashloop on the one setting an
              # operator reaches for to turn the feature OFF.
              AUTH_ARGS=""
              case "${ZIPPIE_AUTH_LEVEL:-off}" in
                ""|off) ;;
                *) AUTH_ARGS="--auth-level ${ZIPPIE_AUTH_LEVEL}"
                   AUTH_ARGS="${AUTH_ARGS} --auth-peer-id ${ZIPPIE_AUTH_PEER_ID:-1}"
                   AUTH_ARGS="${AUTH_ARGS} --auth-key-file /etc/zippie-auth/bond.key"
                   if [ ! -r /etc/zippie-auth/bond.key ]; then
                     echo "[transport] auth_level=${ZIPPIE_AUTH_LEVEL} but no readable key at" \
                          "/etc/zippie-auth/bond.key - create the zippie-bond-auth secret" \
                          "or set auth_level=off. Refusing to run unauthenticated."
                   fi ;;
              esac

              if [ -n "${ZIPPIE_TRANSPORT_PORT:-}" ]; then
                (
                  while :; do
                    echo "[transport] starting on :${ZIPPIE_TRANSPORT_PORT}"
                    PYTHONPATH=/pkg python3 -m zippie.home_transport \
                      --listen-port "$ZIPPIE_TRANSPORT_PORT" \
                      --wg-server-port "${ZIPPIE_HOME_PORTS%%,*}" \
                      $AUTH_ARGS \
                      || echo "[transport] exited rc=$? - restarting in 5s"
                    sleep 5
                  done
                ) &
              else
                echo "[transport] disabled (ZIPPIE_TRANSPORT_PORT unset) - route mode only"
              fi

              # wg-quick has done its work; hold the pod so the interface and
              # its NAT rules persist. Tear down cleanly on SIGTERM so the
              # MASQUERADE and FORWARD rules do not leak across restarts.
              trap 'zippie-home down || true; exit 0' TERM INT
              while :; do sleep 3600 & wait $!; done
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            # The address travel clients dial. A bare residential IP works but moves;
            # point this at DDNS once one exists. Changing it does NOT rekey.
            - name: ZIPPIE_HOME_ENDPOINT
              valueFrom:
                configMapKeyRef: {name: zippie-home-config, key: endpoint}
            - name: ZIPPIE_HOME_PORTS
              valueFrom:
                configMapKeyRef: {name: zippie-home-config, key: ports}
            # Leave empty to auto-detect from the default route.
            - name: ZIPPIE_HOME_WAN
              valueFrom:
                configMapKeyRef: {name: zippie-home-config, key: wan_iface}
            - name: ZIPPIE_HOME_STATE
              value: /var/lib/zippie
            # Local port the transport binds. Public ports are REDIRECTed to
            # it. Empty string = route mode only, which is the default and the
            # currently proven configuration.
            - name: ZIPPIE_TRANSPORT_PORT
              valueFrom:
                configMapKeyRef: {name: zippie-home-config, key: transport_port}
            # Which public ports the transport claims. One spare port = staged
            # rollout; empty (with a port set) = the flag day.
            - name: ZIPPIE_TRANSPORT_PUBLIC_PORTS
              valueFrom:
                configMapKeyRef: {name: zippie-home-config, key: transport_public_ports}
            # HEADER MAC (#2172). Empty/absent = off, which is byte-for-byte
            # the wire this pod speaks today - so applying this manifest does
            # not begin the rollout, it only makes the rollout possible.
            #
            # HOME MOVES FIRST at every rung, because home is reachable from a
            # keyboard and the travel router may be in a moving car. See
            # zippie/auth.py for the ladder and the exact order.
            - name: ZIPPIE_AUTH_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: zippie-home-config
                  key: auth_level
                  optional: true
            - name: ZIPPIE_AUTH_PEER_ID
              valueFrom:
                configMapKeyRef:
                  name: zippie-home-config
                  key: auth_peer_id
                  optional: true
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
            # PYTHONPATH=/pkg, so this must land at /pkg/zippie for
            # `import zippie.home_transport` to resolve.
            - {name: transport-pkg, mountPath: /pkg/zippie, readOnly: true}
            # The shared bond secret, as a FILE and never an env var: an env
            # var lands in /proc/<pid>/environ, in any crash dump, and in the
            # pod spec for anyone with `get pod`. 0400 because auth.py REFUSES
            # to read a key that is group- or world-readable.
            - {name: auth-key, mountPath: /etc/zippie-auth, readOnly: true}
            - {name: state, mountPath: /var/lib/zippie}
            # wg-quick writes/reads the interface config here. Kept on the same
            # PVC so a restart reuses the existing keys rather than regenerating.
            - {name: state, mountPath: /etc/wireguard, subPath: wireguard}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            # NET_ADMIN: create the wg interface, write iptables NAT rules.
            # privileged is NOT used - NET_ADMIN + hostNetwork is sufficient and
            # a much smaller grant.
            capabilities:
              add: ["NET_ADMIN", "NET_RAW"]
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          livenessProbe:
            # The interface existing is the real health signal - the process can
            # be alive while wg-quick has been torn down underneath it.
            exec:
              command: ["/bin/sh", "-c", "test -e /sys/class/net/pb-home0"]
            initialDelaySeconds: 60
            periodSeconds: 60
            failureThreshold: 3
          readinessProbe:
            # A ROLLOUT THAT CANNOT FAIL IS NOT A ROLLOUT. Without this the
            # Deployment reported success the moment the pod was Running, so a
            # pod that came up and bound nothing was indistinguishable from a
            # working one - and `kubectl rollout status` said "successfully
            # rolled out" either way. That is what made a bad rollout invisible
            # and a hand-rolled deadman necessary.
            #
            # NOT the same check as liveness. Liveness asks whether the WireGuard
            # interface exists, which survives the transport dying; this asks
            # whether the transport actually BOUND ITS PUBLIC PORT, which is the
            # one thing that has to be true for a travel router to reach home.
            # Verified both directions against the live pod before shipping:
            # rc=0 for :51931, rc=1 for a port nothing binds - a probe that
            # cannot fail would be worse than none.
            #
            # `Recreate` + hostNetwork means there is no surge and no blue/green
            # here: one host UDP port, and a Reassembler holding per-instance
            # ordered-stream state, so two pods cannot share the traffic. This
            # cannot make the rollout overlap - it makes its FAILURE VISIBLE, so
            # progressDeadlineSeconds can end it and a human or a controller can
            # undo it.
            exec:
              command: ["/bin/sh", "-c", "ss -lun | grep -q '0.0.0.0:51931'"]
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: scripts
          configMap: {name: zippie-home-script, defaultMode: 0555}
        - name: transport-pkg
          configMap: {name: zippie-transport-pkg, defaultMode: 0555}
        # optional: true is what keeps this manifest applyable BEFORE the
        # secret exists. A missing Secret must not stop the pod: this pod
        # carries the household's traffic, and the auth rung defaults to off,
        # so "no key yet" is the normal state until the rollout starts.
        #
        # Created out of band, never from git:
        #   wg genpsk | kubectl -n zippie create secret generic zippie-bond-auth \
        #       --from-file=bond.key=/dev/stdin
        - name: auth-key
          secret:
            secretName: zippie-bond-auth
            optional: true
            defaultMode: 0400
        - name: state
          persistentVolumeClaim: {claimName: zippie-home-state}
