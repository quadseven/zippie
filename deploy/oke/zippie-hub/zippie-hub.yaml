# The zippie hub: one page for every node running zippie.
#
# Replaces the Caddy block that reverse-proxied zippie.ts.example-home.invalid straight at
# the one router. That block's own comment predicted this move: "For a second
# edge router, switch to one handle_path per router and serve a fleet page at
# /." This is that fleet page.
#
# COMPATIBILITY IS THE WHOLE RISK HERE. Both phone apps fetch /api/status and
# /api/series at this hostname. The hub proxies both to the primary router, so
# the apps keep working through the cutover; serving only the new /api/nodes
# would break them the moment DNS moved, and the phones would show "console not
# reachable" with nothing explaining why.
apiVersion: v1
kind: ConfigMap
metadata:
  name: zippie-hub-config
  namespace: zippie
data:
  # NO ADDRESS LIVES HERE (#17). It used to: `192.0.2.30`, RFC 5737
  # documentation space, guaranteed by standard to never answer - so every
  # poll timed out and the fleet page read "not answering / never" forever,
  # while the operator's own phone was proving the router fine over the same
  # tailnet the hub could have dialled instead. This is the third time a
  # scrub has left a reserved-range placeholder where a real runtime value
  # belonged (see AGENTS.md); the fix here is to stop committing the value at
  # all, not to replace it with a better-looking placeholder that still has
  # to be a literal.
  #
  # THE ROUTER IS PORTABLE, SO A COMMITTED ADDRESS IS ALREADY WRONG THE
  # MOMENT IT SHIPS. hub.py's own design states the source that is actually
  # current: "a router sits on the tailnet at a known name" - the same name
  # the operator already uses by hand (docs/tailnet-home.md, docs/
  # state-of-play.md). `${TRAVEL_ROUTER_HOST}` is expanded by hub.py at
  # process start from the TRAVEL_ROUTER_HOST env var below, which is sourced
  # from a Secret this repo does not define - the same out-of-band pattern
  # ZIPPIE_HUB_TOKEN already uses, so the real value never enters git, a
  # GitHub secret, or this file's history. DNS is re-resolved on every poll,
  # so the router moving networks never requires a redeploy here - only
  # MagicDNS has to know where it is, which is the whole point of a tailnet.
  #
  # A MISSING OR RESERVED VALUE IS REFUSED, LOUDLY, NOT DIALLED. hub.py
  # screens the expanded status_url before ever touching the network -
  # `router_config_error` in hub.py, the same RESERVED-range principle
  # scripts/deploy-openwrt.sh already applies to the router's own config -
  # and a router that fails this check is never polled and is reported with
  # its own distinct state everywhere a poll outcome surfaces, rather than
  # read as "not answering" identically to a genuinely dead router.
  hub.json: |
    {
      "routers": [
        {
          "name": "travel-router",
          "label": "the travel router (GL-MT3000)",
          "status_url": "http://${TRAVEL_ROUTER_HOST}:8787/api/status"
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zippie-hub
  namespace: zippie
spec:
  replicas: 1
  # HOW MANY OLD REPLICASETS TO KEEP, and therefore how many generator
  # ConfigMaps stay pinned (#64).
  #
  # THE GENERATOR IS NOT THE LEAK. `configMapGenerator` mints a new
  # hash-suffixed ConfigMap on every content change - that is the point, it is
  # what rolls the pod - and `kubectl apply` cannot prune, so old ones stay.
  # But each retained ReplicaSet REFERENCES its ConfigMap generation, which is
  # exactly what makes `kubectl rollout undo` work. So the ConfigMaps are not
  # junk while the ReplicaSets that name them are kept: deleting them would
  # silently break rollback, which is this issue's own fourth criterion.
  #
  # The unbounded thing was the rollback window. Unset, this defaults to 10, so
  # each workload pins up to ten ConfigMap generations forever. Reconciled live
  # 2026-08-10: 11 ConfigMaps, 5 mounted by a running pod, 6 held by a
  # ReplicaSet, and ZERO referenced by nothing - the accumulation is entirely
  # retained history, not orphans.
  #
  # 3 because the useful rollback is "the one before this", occasionally two
  # back; past that you deploy a fix forward rather than reaching for a
  # fortnight-old revision. Raising it is this one line if a longer window is
  # ever wanted, and Kubernetes garbage-collects the excess ReplicaSets itself -
  # nothing here deletes anything by hand.
  revisionHistoryLimit: 3
  # Recreate, not RollingUpdate: client pushes are held in memory, so two
  # replicas would each hold half the fleet and the page would flicker between
  # them depending on which one answered.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: zippie-hub}
  template:
    metadata:
      # No tags.* service labels: they were read by the retired Datadog
      # agent (#406). Datadog is off.
      labels:
        app: zippie-hub
    spec:
      # The LAN worker by name. It is where Caddy already runs and where the
      # tailnet route to the travel router is direct rather than relayed.
      nodeSelector:
        zippie.dev/home-exit: "true"
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: hub
          # Stock python. The hub is stdlib-only on purpose - it is the piece
          # that must keep answering when everything it monitors is broken, and
          # a dependency tree is one more thing that can stop it doing that.
          image: python:3.12-alpine
          command: ["python3", "/app/hub.py"]
          env:
            - {name: ZIPPIE_HUB_CONFIG, value: /etc/zippie/hub.json}
            - {name: ZIPPIE_HUB_PORT, value: "8080"}
            # The ConfigMap mount is flat; see hub.py.
            - {name: ZIPPIE_HUB_STATIC, value: /app}
            - name: ZIPPIE_HUB_TOKEN
              valueFrom:
                secretKeyRef: {name: zippie-hub-token, key: token}
            # THE ROUTER'S ADDRESS (#17). Expanded into hub.json's
            # `${TRAVEL_ROUTER_HOST}` above at process start. Sourced from a
            # Secret this repo does not define - same as zippie-hub-token
            # above - because the value is the router's current tailnet host,
            # and the router is portable: a literal here would already be
            # wrong the moment it shipped, and would have to be scrubbed
            # before commit, which is exactly the failure class this fixes.
            #
            # A DNS NAME, NOT AN ADDRESS. The Secret holds a public DNS name
            # whose A record is the router's tailnet address, kept by the
            # operator's DNS stack and synced into this Secret from the
            # operator's parameter store. This pod cannot resolve
            # MagicDNS names, but it resolves public DNS, so a name survives
            # the router being re-addressed on the tailnet with no change
            # here and no hand-edited Secret.
            # Missing or reserved-for-documentation values are refused by
            # hub.py's own guard rather than dialled - see router_config_error.
            #
            # optional: true IS LOAD-BEARING, NOT A DEFAULT LEFT IN PLACE. A
            # required secretKeyRef against a Secret that does not exist yet
            # blocks the POD, not just the router: CreateContainerConfigError,
            # and /api/nodes, /livez and every other route this same container
            # serves go down with it. That is a worse outage than the one
            # this fix closes. Optional means an unset Secret simply leaves
            # the env var unset, hub.py's own guard reports the router as
            # config_error rather than crash-looping the pod, and the hub -
            # whose entire design point is staying up while everything it
            # monitors is broken - keeps doing exactly that.
            - name: TRAVEL_ROUTER_HOST
              valueFrom:
                secretKeyRef: {name: zippie-hub-router, key: host, optional: true}
            # NO TELEMETRY ENV (#406). This pod used to carry telemetry wiring
            # for the hub's hand-rolled spans and DogStatsD gauges. Datadog
            # is off and its agent is retired, so hub.py logs its request
            # and router-health lines instead; nothing here points it at
            # an agent any more.
          # hostPort, NOT just a Service. Caddy runs hostNetwork with
          # dnsPolicy Default, so it uses the NODE's resolver and cannot
          # resolve *.svc.cluster.local at all - pointing it at the Service
          # name 502'd every request and took the hostname down until it was
          # reverted. A hostPort on the same node is reachable at 127.0.0.1,
          # which is exactly how Caddy reached the router before this.
          ports:
            - {containerPort: 8080, hostPort: 8790, name: http}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: app, mountPath: /app, readOnly: true}
            - {name: config, mountPath: /etc/zippie, readOnly: true}
          livenessProbe:
            httpGet: {path: /livez, port: 8080}
            initialDelaySeconds: 5
          readinessProbe:
            httpGet: {path: /readyz, port: 8080}
            initialDelaySeconds: 3
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits: {memory: 192Mi}
      volumes:
        - name: app
          configMap: {name: zippie-hub-app}
        - name: config
          configMap: {name: zippie-hub-config}
---
apiVersion: v1
kind: Service
metadata:
  name: zippie-hub
  namespace: zippie
spec:
  selector: {app: zippie-hub}
  ports: [{port: 80, targetPort: 8080, name: http}]
