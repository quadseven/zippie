# AndroidX is not a preference here - every dependency this app uses (Compose,
# activity, core-ktx) ships as AndroidX, and without this the build fails at
# checkDebugAarMetadata with a wall of dependency paths rather than one clear
# line. Found on the first real build, 2026-08-05.
android.useAndroidX=true

# The build machine is shared with the iOS pipeline, so keep
# this build modest rather than letting it take the whole box.
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=false
org.gradle.workers.max=1