name: Check - device drift

on:
  schedule:
    - cron: '31 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    if: github.repository == 'quadseven/zippie'
    runs-on: arc-zippie
    # A drift probe is a handful of HTTP status reads; a hung one must not
    # hold the self-hosted runner for the 6-hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Compare live devices with this checkout of main
        env:
          ZIPPIE_STATUS_URLS: ${{ secrets.ZIPPIE_STATUS_URLS }}
        run: python3 scripts/check-device-drift.py
