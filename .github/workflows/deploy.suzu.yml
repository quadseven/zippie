name: deploy - suzu

# WHY THIS EXISTS (#187). `scripts/deploy-openwrt.sh` was only ever run by hand,
# so merging to main changed the repo and left the router untouched. That is not
# theoretical: a corrected `any_leg_carrying` was applied to suzu directly and
# never committed, the two copies disagreed for hours, and the next hand-run
# deploy would have reinstalled the broken version over the working one.
#
# The deploy script already proves its own work - it refuses to deploy something
# it cannot identify later, proves the bytes on the router equal the bytes here,
# restarts, and proves the RUNNING agent reports the fingerprint just installed.
# This workflow does not re-derive any of that. It provides the two things the
# script cannot: a trigger nobody has to remember, and a credential that is not
# somebody's laptop.

on:
  push:
    branches: [main]
    paths:
      - 'travel/**'
      - 'scripts/deploy-openwrt.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # NEVER TWO DEPLOYS AT ONCE. The script copies over a tar pipe and restarts the
  # agent; two of those interleaved would leave the router in a state neither run
  # believes it created, and the fingerprint proof would then be checking the
  # wrong deploy's work.
  group: deploy-suzu
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy and prove
    # NOT ON A FORK. This holds a credential to a live router; a fork's push
    # must never reach it. `no-hosted-runners` is standing, and the runner also
    # has to be able to reach the tailnet - measured 2026-08-24 from
    # k8s-oke-lan-sp7p-worker-01, which is where arc-zippie sits.
    if: github.repository == 'quadseven/zippie'
    runs-on: arc-zippie
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Load the deploy key
        env:
          KEY_B64: ${{ secrets.SUZU_DEPLOY_SSH_KEY_B64 }}
          SUZU_HOST: ${{ secrets.SUZU_DEPLOY_TARGET }}
        # AN AGENT, NOT A FILE ON DISK. deploy-openwrt.sh invokes bare
        # `ssh root@$HOST` with no -i, so the identity has to arrive through the
        # environment. An agent also dies with the job, where a key written to
        # ~/.ssh outlives it on a runner that other jobs share.
        run: |
          set -euo pipefail
          if [ -z "${KEY_B64:-}" ]; then
            echo "::error::SUZU_DEPLOY_SSH_KEY_B64 is not set. Seed it from SSM /infra/zippie/suzu_deploy_ssh_key_b64."
            exit 1
          fi
          eval "$(ssh-agent -s)" >/dev/null
          printf '%s' "$KEY_B64" | base64 -d | ssh-add - >/dev/null 2>&1 \
            || { echo "::error::the deploy key did not load - it may be truncated or not a private key"; exit 1; }
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # The router's host key, pinned on first contact rather than disabled.
          # StrictHostKeyChecking=no would accept any host answering that address.
          ssh-keyscan -T 10 -H "$SUZU_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Is the router even there?
        id: reach
        env:
          SUZU_HOST: ${{ secrets.SUZU_DEPLOY_TARGET }}
        # AN ABSENT ROUTER IS NOT A BROKEN MERGE. suzu is a travel router; it
        # will be powered off, in a car, or on somebody else's network. Failing
        # main for that would train everybody to ignore this workflow, and the
        # drift check on the router is what keeps the estate honest when a deploy
        # never happens. So: unreachable is reported loudly and exits GREEN, and
        # only a router that answers and then fails its own proof turns this red.
        run: |
          set -euo pipefail
          # BARE HOST, because deploy-openwrt.sh prepends root@ itself - passing
          # it a user@host produces root@root@... and every ssh silently fails.
          # Found by the script's own --dry-run before this ever ran for real.
          HOST="$SUZU_HOST"
          if timeout 20 ssh -o BatchMode=yes -o ConnectTimeout=10 \
               -o StrictHostKeyChecking=accept-new "root@$HOST" 'exit 0' 2>/dev/null; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
            echo "::notice::suzu answered at $HOST"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::suzu did not answer at $HOST, so nothing was deployed. This is not a failure - the router is portable and is often off. travel/gl-mt3000/drift-check.sh runs ON the router and will report the resulting drift to Datadog the moment it comes back."
          fi

      - name: Deploy, and let the script prove it
        if: steps.reach.outputs.reachable == 'true'
        env:
          SUZU_HOST: ${{ secrets.SUZU_DEPLOY_TARGET }}
        # NO --dry-run, NO --prune. Pruning removes modules the repo no longer
        # has, which is a destructive default on a box that is sometimes the only
        # uplink; it stays a deliberate hand-run flag.
        #
        # The script exits non-zero on every proof it fails - bytes differing
        # after copy, the agent not serving a fingerprint within 30s, or the
        # running agent reporting a fingerprint that is not the one installed. So
        # this step's exit code IS the verification, and re-checking it here
        # would be a second answer to a question that already has one.
        run: |
          set -euo pipefail
          scripts/deploy-openwrt.sh "$SUZU_HOST"
