name: check.leak-scan

# Thin caller for the shared public-repo leak scan. This repo is
# public: every PR's diff AND its title/body are scanned for private
# infrastructure identifiers (hostnames, private-range IPs, device
# identifiers, local user paths, refs that may name a private repo). The
# scanner and its patterns live in quadseven/infra-public; see
# _reusable.leak-scan.yml there for the mechanism and exit-code contract.
#
# Enforcing mode makes findings fail the PR check. This repo uses private-range
# addresses in tests and examples; deliberate values need a reason beside a
# `leak-guard-allow` marker on the same line. The separate operator-hosts guard
# checks the address ranges permitted in the current tree.
#
# DENY-LIST LAYER (#38). Hostnames have no shape: the operator-hosts guard can
# allowlist address RANGES, but a bare router nickname matches no pattern, and
# writing it in a public guard would publish it. Terms like that (host
# codenames, people, products) are read at run time from the SSM parameter
# below, through the role in the LEAK_SCAN_ROLE_ARN secret. That role can read
# this one parameter and nothing else, and trusts only pull_request runs of
# the public repos that share it. The terms never live in this repo, the log
# shows only how many were loaded, and a hit is redacted. An unreadable or
# empty list fails the check rather than passing shapes-only, and a fork PR
# gets no secrets, so the scan fails closed there too.
#
# `edited` is in the trigger list on purpose: a PR body can leak long after
# the last push.
#
# allowed-repo-refs: repos this one cites by `<name>#123` as a matter of
# course. This repo's own refs are always exempt and need no entry.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  leak-scan:
    uses: quadseven/infra-public/.github/workflows/_reusable.leak-scan.yml@273755079c88172df39501ee6914fd878c0920bc
    permissions:
      contents: read
      # Mint the OIDC token for the deny-list read role.
      id-token: write
    with:
      allowed-repo-refs: infra-public, muster
      enforce: true
      deny-list-ssm-param: /infra/leak-scan/deny-list
    secrets:
      aws-role-arn: ${{ secrets.LEAK_SCAN_ROLE_ARN }}
